<style>
/* Una sola película: fondo noche, marco 16:9 centrado */
[hidden] { display: none !important; }
:root {
  --bg: #0b0617;
  --fg: #fff7fb;
  --accent: #ff7aa8;
  --accent-2: #ffd3e6;
  --panel: rgba(18, 10, 38, .62);
  --ui: "Nunito", "Segoe UI", system-ui, sans-serif;
  --disp: "Fraunces", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  box-sizing: border-box;
}
#app { height: 100%; display: flex; align-items: center; justify-content: center; }
#frame {
  position: relative;
  width: 960px; height: 540px;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 20px 80px rgba(255, 122, 168, .18);
  --u: .75;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: calc(var(--u) * 70px) calc(var(--u) * 90px) calc(var(--u) * 46px);
  text-align: center;
  font-family: var(--disp);
  font-style: italic;
  font-weight: 500;
  font-size: calc(var(--u) * 29px);
  line-height: 1.32;
  color: #fff;
  text-wrap: balance;
  text-shadow: 0 2px 14px rgba(20, 8, 40, .85), 0 0 24px rgba(255, 140, 190, .45);
  background: linear-gradient(to top, rgba(10, 4, 28, .55), rgba(10, 4, 28, 0));
  opacity: 0; transition: opacity .55s ease;
  pointer-events: none;
}
#cap.on { opacity: 1; }

#hint {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: var(--panel); color: var(--accent-2);
  padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 700;
  pointer-events: none; z-index: 5;
}

#start, #end {
  position: absolute; inset: 0; z-index: 6;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
#start {
  background: radial-gradient(ellipse at 50% 40%, rgba(60, 30, 110, .55), rgba(8, 4, 24, .88) 70%);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
#start.off { opacity: 0; pointer-events: none; transition: opacity .8s ease; }
.start-inner { max-width: 80%; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 14px); }
.start-kicker { margin: 0; font-family: "Caveat", "Segoe Script", cursive; font-weight: 700; font-size: calc(var(--u) * 34px); color: var(--accent-2); letter-spacing: .02em; }
#start h1 { margin: 0; font-family: var(--disp); font-weight: 600; font-size: calc(var(--u) * 64px); line-height: 1.05; text-wrap: balance; text-shadow: 0 0 40px rgba(255, 130, 180, .7); }
.start-sub { margin: 0; font-size: calc(var(--u) * 19px); color: #f2dff0; }
.start-note { margin: 0; font-size: calc(var(--u) * 14px); color: #cdb8e0; }
#btnStart, #btnAgain {
  appearance: none; border: 0; cursor: pointer;
  font-family: var(--ui); font-weight: 800; font-size: calc(var(--u) * 21px);
  padding: calc(var(--u) * 14px) calc(var(--u) * 38px);
  border-radius: 99px; color: #fff;
  background: linear-gradient(135deg, #ff7aa8, #ff9a6b);
  box-shadow: 0 8px 30px rgba(255, 110, 160, .5);
  margin-top: calc(var(--u) * 6px);
  transition: transform .15s ease, box-shadow .15s ease;
}
#btnStart:hover:not(:disabled), #btnAgain:hover { transform: translateY(-2px) scale(1.03); }
#btnStart:disabled { opacity: .7; cursor: default; }
#btnStart:focus-visible, #btnAgain:focus-visible, #bar button:focus-visible, #prog:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#end { background: rgba(8, 4, 24, .35); align-items: flex-end; padding-bottom: calc(var(--u) * 54px); pointer-events: none; }
#end button { pointer-events: auto; }

#bar {
  position: absolute; left: 0; right: 0; top: 0; z-index: 4;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: linear-gradient(to bottom, rgba(10, 4, 28, .7), rgba(10, 4, 28, 0));
  opacity: 0; transition: opacity .35s ease; pointer-events: none;
}
#frame.ui #bar { opacity: 1; pointer-events: auto; }
#bar button {
  appearance: none; border: 0; background: rgba(255, 255, 255, .12); color: #fff;
  width: 36px; height: 36px; border-radius: 50%; padding: 0; display: grid; place-items: center; cursor: pointer; flex: none;
}
#bar button:hover { background: rgba(255, 255, 255, .24); }
#bar svg { width: 18px; height: 18px; fill: currentColor; }
#prog { position: relative; flex: 1; min-width: 40px; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .22); cursor: pointer; }

@media (max-width: 560px) {

  #bar button { width: 30px; height: 30px; }
  #bar svg { width: 15px; height: 15px; }
  #tm { display: none; }
}
@media (prefers-reduced-motion: reduce) { #cap, #start.off { transition: none; } }

    </div>

<script>
/* ---- 00-core.js ---- */
'use strict';
/* ============ base matemática y color ============ */
const W = 1280, H = 720;
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (t) => 1 - Math.pow(1 - clamp(t), 3);
const ei = (t) => Math.pow(clamp(t), 3);
const eio = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const pulse = (t, a, b, c2, d) => sm(seg(t, a, b)) * (1 - sm(seg(t, c2, d)));
const mod = (a, n) => ((a % n) + n) % n;

function mulberry(seed) {
  let s = seed | 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash1(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

const _rgb = {};
function rgbOf(h) {
  if (_rgb[h]) return _rgb[h];
  let s = h.replace('#', '');
  if (s.length === 3) s = s.split('').map((x) => x + x).join('');
  const n = parseInt(s, 16);
  return (_rgb[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
}
function col(h, a) {
  const [r, g, b] = rgbOf(h);
  return a === undefined || a >= 1 ? 'rgb(' + r + ',' + g + ',' + b + ')' : 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
}
function mix(a, b, t) {
  const A = rgbOf(a), B = rgbOf(b);
  const f = (i) => Math.round(lerp(A[i], B[i], clamp(t)));
  return 'rgb(' + f(0) + ',' + f(1) + ',' + f(2) + ')';
}
function mixHex(a, b, t) {
  const A = rgbOf(a), B = rgbOf(b);
  const f = (i) => Math.round(lerp(A[i], B[i], clamp(t))).toString(16).padStart(2, '0');
  return '#' + f(0) + f(1) + f(2);
}
function shade(h, k) { // k<0 oscurece, k>0 aclara
  return k >= 0 ? mixHex(h, '#ffffff', k) : mixHex(h, '#000000', -k);
}
function lin(c, x0, y0, x1, y1, stops) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((s) => g.addColorStop(s[0], s[1]));
  return g;
}
function rad(c, x, y, r0, r1, stops) {
  const g = c.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach((s) => g.addColorStop(s[0], s[1]));
  return g;
}
function keys(ks, u) { // interpola colores hex por claves [[u,'#hex'],...]
  if (u <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) {
    if (u <= ks[i][0]) return mixHex(ks[i - 1][1], ks[i][1], sm((u - ks[i - 1][0]) / (ks[i][0] - ks[i - 1][0])));
  }
  return ks[ks.length - 1][1];
}
function keysN(ks, u) {
  if (u <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) {
    if (u <= ks[i][0]) return lerp(ks[i - 1][1], ks[i][1], sm((u - ks[i - 1][0]) / (ks[i][0] - ks[i - 1][0])));
  }
  return ks[ks.length - 1][1];
}

/* canvas fuera de pantalla */
function off(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* fuentes (con respaldo) */
const F_UI = '"Nunito","Segoe UI",system-ui,sans-serif';
const F_HAND = '"Caveat","Segoe Script","Brush Script MT",cursive';
const F_DISP = '"Fraunces","Georgia","Times New Roman",serif';

/* trazos rápidos */
function rr(c, x, y, w, h, r) {
  if (!(w > 0) || !(h > 0)) { c.rect(x, y, Math.max(0, w || 0), Math.max(0, h || 0)); return; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function heart(c, cx, cy, s) {
  c.moveTo(cx, cy + s * 0.9);
  c.bezierCurveTo(cx - s * 1.6, cy - s * 0.1, cx - s * 0.9, cy - s * 1.2, cx, cy - s * 0.45);
  c.bezierCurveTo(cx + s * 0.9, cy - s * 1.2, cx + s * 1.6, cy - s * 0.1, cx, cy + s * 0.9);
  c.closePath();
}
function fillHeart(c, cx, cy, s, fill) { c.beginPath(); heart(c, cx, cy, s); c.fillStyle = fill; c.fill(); }

/* ---- 10-gfx.js ---- */
'use strict';
/* ============ pintura estilo película anime ============ */

/* cielo en degradé vertical */
function sky(c, stops, y0, y1) {
  c.fillStyle = lin(c, 0, y0 === undefined ? 0 : y0, 0, y1 === undefined ? H : y1, stops);
  c.fillRect(-50, y0 === undefined ? -50 : y0, W + 100, (y1 === undefined ? H + 100 : y1 - y0 + 50));
}

/* resplandor circular */
function glow(c, x, y, r, color, a) {
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = rad(c, x, y, 0, r, [[0, col(color, a)], [0.35, col(color, a * 0.45)], [1, col(color, 0)]]);
  c.fillRect(x - r, y - r, r * 2, r * 2);
  c.restore();
}
function glowN(c, x, y, r, color, a) { // sin lighter, para fondos claros
  c.fillStyle = rad(c, x, y, 0, r, [[0, col(color, a)], [1, col(color, 0)]]);
  c.fillRect(x - r, y - r, r * 2, r * 2);
}

/* nubes de cúmulo pintadas (luz arriba-izquierda por defecto) */
function cloud(c, x, y, s, seed, o) {
  o = o || {};
  const top = o.top || '#ffffff', mid = o.mid || '#dfe9f7', bot = o.bot || '#9fb4d8', rim = o.rim || '#fff6dc';
  const r = mulberry(seed * 977 + 13);
  const n = 8 + ((r() * 5) | 0);
  const cs = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const rd = s * (0.3 + 0.5 * Math.sin(t * Math.PI)) * (0.7 + r() * 0.55);
    cs.push([(t - 0.5) * s * 2.6 + (r() - 0.5) * s * 0.25, -rd * 0.55 * r(), rd]);
  }
  const flat = o.flat === undefined ? 0.28 : o.flat;
  c.save();
  c.translate(x, y);
  c.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  c.beginPath();
  cs.forEach((q) => { c.moveTo(q[0] + q[2], q[1]); c.arc(q[0], q[1], q[2], 0, TAU); });
  c.fillStyle = lin(c, 0, -s * 1.1, 0, s * flat, [[0, top], [0.45, mid], [1, bot]]);
  c.fill();
  c.save();
  c.clip();
  cs.forEach((q) => {
    c.fillStyle = rad(c, q[0] - q[2] * 0.3, q[1] - q[2] * 0.42, 0, q[2] * 1.05, [[0, col(rim, 0.95)], [0.5, col(top, 0.35)], [1, col(top, 0)]]);
    c.fillRect(q[0] - q[2] * 1.2, q[1] - q[2] * 1.2, q[2] * 2.4, q[2] * 2.4);
  });
  c.fillStyle = lin(c, 0, -s * 0.1, 0, s * flat, [[0, col(bot, 0)], [1, col(bot, 0.65)]]);
  c.fillRect(-s * 3, -s * 0.1, s * 6, s);
  c.restore();
  c.restore();
}
function cloudField(c, seed, n, y0, y1, sMin, sMax, t, speed, o) {
  const r = mulberry(seed);
  for (let i = 0; i < n; i++) {
    const s = lerp(sMin, sMax, r());
    const bx = r() * (W + 400) - 200;
    const x = mod(bx + t * speed * (0.6 + s / sMax * 0.8) + 200, W + 400) - 200;
    cloud(c, x, lerp(y0, y1, r()), s, 31 + i * 7 + seed, o);
  }
}

/* rayos de luz (dios rayos) */
function godRays(c, x, y, ang, spread, len, color, a, t) {
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.translate(x, y);
  c.rotate(ang);
  const n = 9;
  for (let i = 0; i < n; i++) {
    const k = i / (n - 1) - 0.5;
    const aa = k * spread;
    const w = 0.035 + 0.04 * hash1(i * 3.1);
    const al = a * (0.35 + 0.65 * hash1(i * 7.3)) * (0.75 + 0.25 * Math.sin(t * 0.7 + i * 1.7));
    c.save();
    c.rotate(aa);
    c.fillStyle = lin(c, 0, 0, len, 0, [[0, col(color, al)], [1, col(color, 0)]]);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(len, -len * w); c.lineTo(len, len * w); c.closePath(); c.fill();
    c.restore();
  }
  c.restore();
}

/* reflejos de lente */
function lensFlare(c, x, y, a, color) {
  color = color || '#ffe9b8';
  const cx = W / 2, cy = H / 2;
  glow(c, x, y, 260, color, a * 0.8);
  glow(c, x, y, 70, '#ffffff', a);
  c.save();
  c.globalCompositeOperation = 'lighter';
  const ghosts = [[0.35, 26, '#ffc9a0', 0.22], [0.6, 46, '#a7d8ff', 0.16], [0.9, 18, '#ffb8d8', 0.2], [1.4, 60, '#c8b6ff', 0.1], [1.75, 30, '#ffe0a8', 0.14]];
  ghosts.forEach((g) => {
    const gx = lerp(x, cx * 2 - x, g[0] * 0.55), gy = lerp(y, cy * 2 - y, g[0] * 0.55);
    c.beginPath(); c.arc(gx, gy, g[1], 0, TAU);
    c.fillStyle = rad(c, gx, gy, g[1] * 0.2, g[1], [[0, col(g[2], 0)], [0.85, col(g[2], g[3] * a)], [1, col(g[2], 0)]]);
    c.fill();
  });
  c.strokeStyle = col('#ffffff', 0.18 * a);
  c.lineWidth = 2;
  c.beginPath(); c.moveTo(x - 360, y); c.lineTo(x + 360, y); c.stroke();
  c.restore();
}

/* luces desenfocadas (bokeh) deterministas */
function bokeh(c, t, seed, n, o) {
  o = o || {};
  const r = mulberry(seed);
  const x0 = o.x0 === undefined ? 0 : o.x0, x1 = o.x1 === undefined ? W : o.x1;
  const y0 = o.y0 === undefined ? 0 : o.y0, y1 = o.y1 === undefined ? H : o.y1;
  const cols = o.colors || ['#fff1c9', '#ffd1e6', '#cfe8ff'];
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const px = lerp(x0, x1, r()), py = lerp(y0, y1, r());
    const rd = lerp(o.rMin || 8, o.rMax || 40, Math.pow(r(), 1.6));
    const ph = r() * TAU, sp = 0.2 + r() * 0.5;
    const x = px + Math.sin(t * sp * 0.6 + ph) * 14 + (o.driftX || 0) * t;
    const y = py + Math.cos(t * sp * 0.5 + ph) * 12 - (o.rise || 0) * t;
    const xx = o.wrap ? mod(x - x0, x1 - x0) + x0 : x;
    const yy = o.wrap ? mod(y - y0, y1 - y0) + y0 : y;
    const al = (o.alpha || 0.35) * (0.45 + 0.55 * Math.sin(t * sp + ph * 2) ** 2) * (0.5 + r() * 0.5);
    const cl = cols[i % cols.length];
    c.fillStyle = rad(c, xx, yy, rd * 0.55, rd, [[0, col(cl, al * 0.55)], [0.9, col(cl, al)], [1, col(cl, 0)]]);
    c.beginPath(); c.arc(xx, yy, rd, 0, TAU); c.fill();
  }
  c.restore();
}

/* pétalos / hojas / confeti que caen (analítico) */
function falling(c, t, seed, n, o) {
  o = o || {};
  const r = mulberry(seed);
  const color = o.colors || ['#ffc6dc', '#ffb0cc', '#fff0f5'];
  for (let i = 0; i < n; i++) {
    const bx = r() * (W + 200) - 100, by = r() * (H + 200);
    const sp = (o.speed || 40) * (0.6 + r() * 0.8), sw = 20 + r() * 40, ph = r() * TAU;
    const sz = (o.size || 9) * (0.6 + r() * 0.8);
    const x = mod(bx + t * (o.wind || 25) * (0.6 + r() * 0.6) + Math.sin(t * 0.9 + ph) * sw + 100, W + 200) - 100;
    const y = mod(by + t * sp + 100, H + 200) - 100;
    const rot = t * (0.8 + r() * 1.6) + ph;

/* partículas de polvo luminoso que flotan */
function dust(c, t, seed, n, x0, y0, x1, y1, o) {

    const ph = r() * TAU, sp = 0.3 + r() * 0.7;
    const x = bx + Math.sin(t * sp + ph) * 18;
    const y = mod(by - t * (o.rise || 12) * (0.5 + r()) - y0, y1 - y0) + y0;
    const al = (0.25 + 0.75 * Math.sin(t * sp * 1.7 + ph) ** 2) * (o.alpha || 0.8);

    c.fillStyle = col(o.color || '#fff4d0', al);
    c.beginPath(); c.arc(x, y, sz, 0, TAU); c.fill();
    c.fillStyle = col(o.color || '#fff4d0', al * 0.18);
    c.beginPath(); c.arc(x, y, sz * 4, 0, TAU); c.fill();

let _grain = null;
function filmGrain(c, t, a) {

/* forma con sombreado de celda (creciente de sombra) y luz de borde */
function cell(c, pathFn, base, o) {
  o = o || {};
  c.beginPath(); pathFn(c); c.fillStyle = base; c.fill();
  if (o.shadow) {
    c.save();
    c.beginPath(); pathFn(c); c.clip();
    c.beginPath(); c.rect(-2000, -2000, 4000, 4000);
    c.save(); c.translate(o.sx === undefined ? 6 : o.sx, o.sy === undefined ? 5 : o.sy);
    pathFn(c); c.restore();
    c.fillStyle = o.shadow; c.fill('evenodd');
    c.restore();
  }
  if (o.rim) {
    c.save();
    c.beginPath(); pathFn(c); c.clip();
    c.beginPath(); c.rect(-2000, -2000, 4000, 4000);
    c.save(); c.translate(o.rx === undefined ? -4 : o.rx, o.ry === undefined ? -3 : o.ry);
    pathFn(c); c.restore();

  if (o.line) { c.beginPath(); pathFn(c); c.lineWidth = o.lw || 1.2; c.strokeStyle = o.line; c.stroke(); }
}

/* cápsula cónica para extremidades */
function limb(c, x1, y1, x2, y2, w1, w2, fill, o) {
  const a = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2;
  const path = (g) => {
    g.moveTo(x1 + Math.cos(a) * w1, y1 + Math.sin(a) * w1);
    g.lineTo(x2 + Math.cos(a) * w2, y2 + Math.sin(a) * w2);
    g.arc(x2, y2, w2, a, a - Math.PI, true);
    g.lineTo(x1 - Math.cos(a) * w1, y1 - Math.sin(a) * w1);
    g.arc(x1, y1, w1, a - Math.PI, a - TAU, true);
    g.closePath();
  };
  cell(c, path, fill, o);
}

/* texto con borde suave */
function textC(c, str, x, y, size, color, o) {
  o = o || {};
  c.save();
  c.font = (o.weight || 700) + ' ' + size + 'px ' + (o.font || F_UI);

  c.fillStyle = color;
  c.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  c.fillText(str, x, y);
  c.restore();
}

/* ---- caminante lateral estilo chibi. h = altura total en px; ph = fase; moving: bool ---- */
function walker(c, who, x, y, h, ph, o) {
  o = o || {};
  const P = PAL[who], girl = who === 'T';
  const dir = o.dir || 1, u = h / 86;
  const moving = o.moving !== false;
  const LN = P.line, LS = 16;
  c.save();
  c.translate(x, y);
  c.scale(dir * u, u);
  const sway = o.sway === undefined ? Math.sin(ph) : o.sway;
  /* piernas */
  const legs = [0, 1].map((i) => {
    const p = ph + i * Math.PI;
    const th = moving ? Math.sin(p) * 0.5 : (i ? -0.04 : 0.04);
    const fl = moving ? 0.08 + 0.95 * Math.pow(Math.max(0, Math.cos(p)), 1.2) : 0.03;
    const kx = Math.sin(th) * LS, ky = Math.cos(th) * LS;
    const th2 = th - fl;
    const ax = kx + Math.sin(th2) * LS, ay = ky + Math.cos(th2) * LS;
    return { kx, ky, ax, ay, th2 };
  });
  const hipY = -(Math.max(legs[0].ay, legs[1].ay) + 3.2);
  const bob = moving ? Math.abs(Math.cos(ph)) * 0.6 : Math.sin(o.t * 2 || 0) * 0.2;
  const hy = hipY - bob;
  const legCol = girl ? P.skin : P.pants;
  const order = legs[0].ax > legs[1].ax ? [1, 0] : [0, 1];
  const OW = 0.9;
  const drawLeg = (i) => {
    const L = legs[i];
    const back = i === 1;
    const fill = back ? shade(legCol, -0.1) : legCol;
    limb(c, 0, hy, L.kx, hy + L.ky, 4.4 + OW, 3.6 + OW, LN);
    limb(c, L.kx, hy + L.ky, L.ax, hy + L.ay, 3.6 + OW, 2.8 + OW, LN);
    limb(c, 0, hy, L.kx, hy + L.ky, 4.4, 3.6, fill);
    limb(c, L.kx, hy + L.ky, L.ax, hy + L.ay, 3.6, 2.8, fill);
    if (girl) { limb(c, L.ax - Math.sin(L.th2) * 5, hy + L.ay - Math.cos(L.th2) * 5, L.ax, hy + L.ay, 3.0, 2.8, '#ffffff'); }
    c.save(); c.translate(L.ax, hy + L.ay); c.rotate(L.th2 * 0.3);
    c.beginPath(); c.moveTo(-3.4, -2); c.lineTo(3.4, -2.6); c.bezierCurveTo(9.5, -1.6, 10.5, 2.2, 7, 4); c.lineTo(-3.8, 4); c.closePath();
    c.fillStyle = back ? shade(P.shoe, -0.1) : P.shoe; c.fill();
    c.lineWidth = 0.9; c.lineJoin = 'round'; c.strokeStyle = LN; c.stroke();
    c.fillStyle = col('#6c6a8a', 0.35); c.fillRect(-3.4, 2.8, 10, 1.2);
    c.restore();
  };
  /* brazos */
  const SY = hy - 19;
  const armA = (i) => {
    const p = ph + i * Math.PI + Math.PI;
    const a = moving ? Math.sin(p) * 0.5 : 0.04 * (i ? -1 : 1);
    const bend = moving ? 0.25 + 0.5 * Math.max(0, Math.cos(p)) : 0.15;
    const sx = 0.5, sy = SY;
    const ex = sx + Math.sin(a) * 10.5, ey = sy + Math.cos(a) * 10.5;
    const a2 = a + bend;
    const wx = ex + Math.sin(a2) * 9.5, wy = ey + Math.cos(a2) * 9.5;
    return { sx, sy, ex, ey, wx, wy };
  };
  const drawArm = (A, back) => {
    const sleeve = back ? shade(P.top, -0.12) : P.top;
    limb(c, A.sx, A.sy, A.ex, A.ey, 3.2 + OW, 2.9 + OW, LN);
    limb(c, A.ex, A.ey, A.wx, A.wy, 2.9 + OW, 2.5 + OW, LN);
    limb(c, A.sx, A.sy, A.ex, A.ey, 3.2, 2.9, sleeve);
    limb(c, A.ex, A.ey, A.wx, A.wy, 2.9, 2.5, sleeve);
    c.beginPath(); c.arc(A.wx, A.wy + 1.2, 2.7, 0, TAU); c.fillStyle = back ? shade(P.skin, -0.08) : P.skin; c.fill();
    c.lineWidth = 0.8; c.strokeStyle = LN; c.stroke();
  };
  const A0 = armA(0), A1 = armA(1);
  drawArm(A1, true);
  if (o.bagHand === 'back') { c.fillStyle = P.bag; c.beginPath(); rr(c, A1.wx - 5, A1.wy + 1, 10, 12, 2); c.fill(); }
  drawLeg(order[0]);
  /* mochila */
  if (!girl && o.pack !== false) {
    cell(c, (g) => rr(g, -14.5, hy - 24, 10, 19, 3.4), P.bag, { shadow: col(P.bagSh, 0.7), sx: 2, sy: 1, line: LN, lw: 0.9 });
    c.fillStyle = P.bagSh; c.beginPath(); rr(c, -14, hy - 14, 7, 6, 2); c.fill();
  }
  drawLeg(order[1]);
  /* torso y falda */
  if (girl) {
    const sw = Math.sin(ph * 1) * 1.4;
    cell(c, (g) => { g.moveTo(-6, hy - 6); g.lineTo(6.2, hy - 6); g.bezierCurveTo(9.4 + sw, hy + 1, 10.4 + sw, hy + 6, 10 + sw, hy + 10); g.lineTo(-10.6 + sw * 0.5, hy + 10); g.bezierCurveTo(-10.4, hy + 5, -8.2, hy - 1, -6, hy - 6); g.closePath(); }, P.skirt, { shadow: col(P.skirtSh, 0.75), sx: 3, sy: 0, line: LN, lw: 0.9 });
  }
  cell(c, (g) => {
    g.moveTo(-6.4, hy - 25); g.bezierCurveTo(-7.2, hy - 18, -6.8, hy - 9, -6.2, hy - 2.5);
    g.lineTo(6.2, hy - 2.5); g.bezierCurveTo(6.8, hy - 9, 7.2, hy - 18, 6.4, hy - 25);
    g.bezierCurveTo(3.4, hy - 27, -3.4, hy - 27, -6.4, hy - 25); g.closePath();
  }, P.top, { shadow: col(P.topSh, 0.7), sx: 3, sy: 0, rim: col(P.topHi, 0.5), rx: -1.2, ry: 0, line: LN, lw: 0.9 });
  if (girl) { c.fillStyle = P.topHi; c.beginPath(); c.moveTo(-3, hy - 26); c.quadraticCurveTo(3.8, hy - 22, 5.6, hy - 25); c.lineTo(5.8, hy - 23); c.quadraticCurveTo(2, hy - 19, -3, hy - 23.5); c.fill(); }
  /* cabeza y cuello */
  c.fillStyle = P.skin; c.beginPath(); rr(c, -1.8, hy - 30, 4.6, 7, 1.8); c.fill();
  const headX = 1.8, headY = hy - 36;
  drawHeadProfile(c, who, headX, headY, 10.5, { dir: 1, mouth: 'smile', eyes: o.eyes || 'open', blush: 0.45, sway: moving ? sway * 0.3 : 0 });
  drawArm(A0, false);
  if (o.bagHand === 'front') { c.fillStyle = P.bag; c.beginPath(); rr(c, A0.wx - 5, A0.wy + 1, 10, 12, 2); c.fill(); c.lineWidth = 0.8; c.strokeStyle = LN; c.stroke(); }
  c.restore();
}

/* ---- 40-engine.js ---- */
'use strict';
/* ============ motor de escenas ============ */
const SCENES = [];
let TOTAL = 0;
const ST = { t: 0, playing: false, started: false, muted: false, idx: -1, ended: false };
let CV = null, CTX = null, _ctxDepth = 0;
function guardCtx(c) { /* cuenta save/restore para que un error en una escena no deje el lienzo transformado */
  const sv = c.save.bind(c), rs = c.restore.bind(c);
  c.save = function () { _ctxDepth++; sv(); };
  c.restore = function () { if (_ctxDepth > 0) { _ctxDepth--; rs(); } };
}

function defScene(d) { SCENES.push(d); layoutScenes(); return d; }
function layoutScenes() {
  let a = 0;
  SCENES.forEach((s) => { s.start = a; a += s.dur; });
  TOTAL = a;
}
function sceneIndexAt(t) {
  for (let i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i].start) return i;
  return 0;
}

/* efectos de transición: tipo 'black' | 'white' | 'pink' | 'petals' */
const FX_COL = { black: '#0b0617', white: '#fffaf0', pink: '#ffd9e8', night: '#0d1030' };
function fxOverlay(c, type, a, t) {
  if (a <= 0.001) return;
  if (type === 'petals') {
    c.save();
    c.globalAlpha = a;
    c.fillStyle = lin(c, 0, 0, W, H, [[0, '#ffd3e4'], [1, '#ffeef5']]);
    c.fillRect(0, 0, W, H);
    c.restore();
    falling(c, t * 3 + 4, 77, 70, { speed: 260, size: 15, wind: 220, alpha: a, colors: ['#ff9fc0', '#ffc6dc', '#fff'] });
    return;
  }
  c.save();
  c.globalAlpha = a;
  c.fillStyle = FX_COL[type] || type;
  c.fillRect(0, 0, W, H);
  c.restore();
}

function renderAt(t) {
  const c = CTX;
  const i = sceneIndexAt(t), s = SCENES[i];
  const lt = clamp(t - s.start, 0, s.dur), k = lt / s.dur;
  c.save();
  const d0 = _ctxDepth;
  c.clearRect(0, 0, W, H);
  c.fillStyle = '#0b0617'; c.fillRect(0, 0, W, H);
  try { s.draw(c, lt, k, s); } catch (e) { console.error('scene ' + s.id + ': ' + e.message); }
  while (_ctxDepth > d0) c.restore();
  c.restore();
  if (!s.noGrain) {
    filmGrain(c, t, 0.07);
    vignette(c, s.vig === undefined ? 0.45 : s.vig, s.vigColor);
  }
  /* transiciones */
  const fin = s.fxIn || { type: 'black', dur: 0.8 }, fout = s.fxOut || { type: 'black', dur: 0.8 };
  if (i > 0 || fin.force) fxOverlay(c, fin.type, 1 - sm(lt / fin.dur), lt);
  else fxOverlay(c, 'black', 1 - sm(lt / 1.2), lt);
  if (i < SCENES.length - 1) fxOverlay(c, fout.type, sm((lt - (s.dur - fout.dur)) / fout.dur), lt + 3);
  if (ST.idx !== i) { ST.idx = i; onSceneChange(s, i); }
  updateCaption(s, lt);
  if (typeof updateProgress === 'function') updateProgress(t);
}

let _lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  try { frameStep(now); } catch (e) { console.error('frame: ' + e.message); }
}
function frameStep(now) {
  if (typeof watchLag === 'function') watchLag(now);
  const dt = Math.min(0.1, (now - _lastFrame) / 1000);
  _lastFrame = now;
  if (ST.playing) {
    ST.t += dt;
    if (ST.t >= TOTAL - 0.02) { ST.t = TOTAL - 0.02; ST.playing = false; ST.ended = true; onEnd(); }
  }
  if (ST.started) renderAt(ST.t);
}
function seek(t) { ST.t = clamp(t, 0, TOTAL - 0.02); ST.ended = false; renderAt(ST.t); }
function goScene(i) {
  i = clamp(i, 0, SCENES.length - 1);
  ST.t = SCENES[i].start + 0.001; ST.ended = false;
  if (typeof Music !== 'undefined' && ST.started) Music.mood(SCENES[i].music);
  renderAt(ST.t);
}
function nextMark() { // salta a la siguiente marca interna de la escena o a la siguiente escena
  const i = sceneIndexAt(ST.t), s = SCENES[i], lt = ST.t - s.start;
  if (s.marks) { const m = s.marks.find((x) => x > lt + 0.4); if (m !== undefined) { ST.t = s.start + m; return; } }
  goScene(i + 1);
}
function prevMark() {
  const i = sceneIndexAt(ST.t), s = SCENES[i], lt = ST.t - s.start;
  if (lt > 2.5) { goScene(i); return; }
  goScene(i - 1);
}

/* utilidades de escena reutilizables */
function framePanel(c, x, y, w, h, fn) {
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.translate(x, y); fn(w, h); c.restore();
}
function titleText(c, str, x, y, size, a, o) {
  o = o || {};
  textC(c, str, x, y, size, o.color || '#fff', { font: o.font || F_DISP, weight: o.weight || 600, alpha: a, shadow: o.shadow || 'rgba(255,170,200,.65)', blur: o.blur || 24, align: o.align });
}

'use strict';
/* ============ paisajes: Arequipa, campus, calles ============ */

/* ciclo del día: u 0 = amanecer, .12 = mañana, .5 = mediodía, .78 = tarde, .9 = ocaso, 1 = noche */
const DAY_SKY = [
  [0.00, ['#2b3a78', '#8f6fb5', '#ffb28a']],
  [0.10, ['#5a8fe0', '#9fcdf5', '#ffe2c4']],
  [0.30, ['#3f86e8', '#7fc0f7', '#d6efff']],
  [0.55, ['#3a82e6', '#78bdf5', '#cfeaff']],
  [0.74, ['#4c7fd0', '#e6a9a0', '#ffd49a']],
  [0.86, ['#4a3f8f', '#d56f9a', '#ffa86b']],
  [0.95, ['#171c52', '#4b3a86', '#a2508f']],
  [1.00, ['#0b1040', '#1a1f5c', '#3a2d78']],
];
function daySkyStops(u) {
  let a = DAY_SKY[0], b = DAY_SKY[DAY_SKY.length - 1];
  for (let i = 1; i < DAY_SKY.length; i++) if (u <= DAY_SKY[i][0]) { a = DAY_SKY[i - 1]; b = DAY_SKY[i]; break; }
  const k = sm((u - a[0]) / Math.max(0.0001, b[0] - a[0]));
  return a[1].map((hc, i) => mixHex(hc, b[1][i], k));
}
function drawDaySky(c, u, w, h, o) {
  o = o || {};
  const st = daySkyStops(u);
  c.fillStyle = lin(c, 0, 0, 0, h, [[0, st[0]], [0.55, st[1]], [1, st[2]]]);
  c.fillRect(0, 0, w, h);
  const night = sm(seg(u, 0.88, 0.99));
  if (night > 0) starfield(c, o.t || 0, 9, 90, 0, h * 0.7, { alpha: night });
  /* sol */
  const sunU = clamp(u / 0.92, 0, 1);
  if (u < 0.93) {
    const sx = lerp(w * 0.12, w * 0.9, sunU), sy = h * (0.72 - Math.sin(sunU * Math.PI) * 0.6);
    const warm = sm(seg(u, 0.62, 0.86)) + (1 - sm(seg(u, 0.0, 0.12)));
    glow(c, sx, sy, h * 0.7, warm > 0.4 ? '#ffb27a' : '#fff0c8', 0.55);
    glow(c, sx, sy, h * 0.2, '#fff6dc', 0.9);
    c.fillStyle = '#fff9e6'; c.beginPath(); c.arc(sx, sy, h * 0.035, 0, TAU); c.fill();
  }
}

/* Misti: cono casi simétrico, con cima nevada y neblina */
function misti(c, x, base, w, h, o) {
  o = o || {};
  const top = o.top || '#8d93bd', mid = o.mid || '#9aa0c8', bot = o.bot || '#c9c7e0', snow = o.snow || '#f4f2ff';
  c.save();
  c.beginPath();
  c.moveTo(x - w / 2, base);
  c.bezierCurveTo(x - w * 0.3, base - h * 0.2, x - w * 0.14, base - h * 0.75, x - w * 0.07, base - h * 0.98);
  c.lineTo(x - w * 0.02, base - h);
  c.lineTo(x + w * 0.05, base - h * 0.985);
  c.bezierCurveTo(x + w * 0.1, base - h * 0.8, x + w * 0.3, base - h * 0.22, x + w / 2, base);
  c.closePath();
  c.fillStyle = lin(c, 0, base - h, 0, base, [[0, top], [0.55, mid], [1, bot]]);
  c.fill();
  c.save(); c.clip();
  /* luz lateral y quebradas */
  c.fillStyle = lin(c, x - w * 0.3, 0, x + w * 0.3, 0, [[0, col('#ffffff', o.lit || 0.12)], [0.5, col('#ffffff', 0)], [1, col('#2a2a60', 0.22)]]);
  c.fillRect(x - w / 2, base - h, w, h);
  c.strokeStyle = col('#4a4a86', 0.09); c.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const a = (i - 4) / 4;
    c.beginPath(); c.moveTo(x + a * w * 0.03, base - h * 0.96); c.quadraticCurveTo(x + a * w * 0.18, base - h * 0.5, x + a * w * 0.42, base - h * 0.02); c.stroke();
  }
  /* nieve */
  c.beginPath();
  c.moveTo(x - w * 0.09, base - h * 0.92);
  c.quadraticCurveTo(x - w * 0.04, base - h * 0.84, x - w * 0.06, base - h * 0.8);
  c.quadraticCurveTo(x - w * 0.02, base - h * 0.86, x + w * 0.0, base - h * 0.79);
  c.quadraticCurveTo(x + w * 0.04, base - h * 0.87, x + w * 0.07, base - h * 0.82);
  c.lineTo(x + w * 0.1, base - h * 0.9); c.lineTo(x, base - h * 1.02); c.closePath();
  c.fillStyle = col(snow, o.snowA === undefined ? 0.85 : o.snowA); c.fill();
  /* bruma en la base */
  c.fillStyle = lin(c, 0, base - h * 0.35, 0, base, [[0, col(bot, 0)], [1, col(bot, 0.9)]]);
  c.fillRect(x - w / 2, base - h * 0.35, w, h * 0.36);
  c.restore();
  c.restore();
}
function ridge(c, base, amp, color, seed, o) {
  o = o || {};
  const r = mulberry(seed);
  const pts = [];
  const n = 14;
  for (let i = 0; i <= n; i++) pts.push([i / n * (W + 120) - 60, base - amp * (0.3 + 0.7 * r()) * (0.6 + 0.4 * Math.sin(i * 0.9 + seed))]);
  c.beginPath(); c.moveTo(-60, H + 20);
  pts.forEach((p, i) => { if (i === 0) c.lineTo(p[0], p[1]); else { const q = pts[i - 1]; c.quadraticCurveTo(q[0], q[1], (q[0] + p[0]) / 2, (q[1] + p[1]) / 2); } });
  c.lineTo(W + 60, H + 20); c.closePath();
  c.fillStyle = lin(c, 0, base - amp, 0, base + amp, [[0, color], [1, o.bot || mixHex(color, '#ffffff', 0.35)]]);
  c.fill();
}

/* palmera */
function palm(c, x, base, h, t, o) {
  o = o || {};
  const lean = (o.lean === undefined ? 0.1 : o.lean) * h;
  const sway = Math.sin(t * 0.8 + x * 0.01) * 4;
  c.save();
  c.beginPath();
  c.moveTo(x - h * 0.03, base);
  c.quadraticCurveTo(x + lean * 0.4, base - h * 0.55, x + lean + sway * 0.4, base - h);
  c.lineTo(x + lean + sway * 0.4 + h * 0.025, base - h);
  c.quadraticCurveTo(x + lean * 0.4 + h * 0.03, base - h * 0.55, x + h * 0.03, base);
  c.closePath();
  c.fillStyle = lin(c, x - 10, 0, x + 12, 0, [[0, o.trunkLit || '#a58a6a'], [1, o.trunk || '#6b5640']]); c.fill();
  const tx = x + lean + sway * 0.4, ty = base - h;
  const green = o.leaf || '#3e8a52', gl = o.leafLit || '#8bd08a';
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI + (i / 8) * Math.PI + Math.sin(t * 1.1 + i) * 0.04;
    const L = h * (0.38 + (i % 2) * 0.06);
    const ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L * 0.55 + L * 0.35;
    c.beginPath();
    c.moveTo(tx, ty);
    c.quadraticCurveTo(tx + Math.cos(a) * L * 0.55, ty + Math.sin(a) * L * 0.6 - L * 0.12, ex, ey);
    c.quadraticCurveTo(tx + Math.cos(a) * L * 0.5, ty + Math.sin(a) * L * 0.4 + L * 0.12, tx, ty);
    c.fillStyle = lin(c, tx, ty - L * 0.4, tx, ey, [[0, gl], [1, green]]);
    c.fill();
  }
  c.restore();
}

/* árbol frondoso pintado */
function tree(c, x, base, s, t, o) {
  o = o || {};
  const leaf = o.leaf || '#4fa564', lit = o.lit || '#a6dc8a', dark = o.dark || '#2c6d4c';
  const sway = Math.sin(t * 0.7 + x * 0.02) * 2.5;
  c.save();
  c.beginPath();
  c.moveTo(x - s * 0.06, base); c.quadraticCurveTo(x - s * 0.04, base - s * 0.45, x - s * 0.1 + sway * 0.3, base - s * 0.7);
  c.lineTo(x + s * 0.12 + sway * 0.3, base - s * 0.7); c.quadraticCurveTo(x + s * 0.05, base - s * 0.4, x + s * 0.08, base); c.closePath();
  c.fillStyle = lin(c, x - s * 0.1, 0, x + s * 0.1, 0, [[0, o.trunkLit || '#9b7656'], [1, o.trunk || '#5e4533']]); c.fill();
  const r = mulberry(Math.floor(x * 7 + s));
  const bl = [];
  for (let i = 0; i < 12; i++) bl.push([x + (r() - 0.5) * s * 0.95 + sway, base - s * (0.72 + r() * 0.42), s * (0.2 + r() * 0.16)]);
  bl.forEach((b) => { c.fillStyle = dark; c.beginPath(); c.arc(b[0] + b[2] * 0.12, b[1] + b[2] * 0.14, b[2], 0, TAU); c.fill(); });
  bl.forEach((b) => {
    c.beginPath(); c.arc(b[0], b[1], b[2], 0, TAU);
    c.fillStyle = rad(c, b[0] - b[2] * 0.3, b[1] - b[2] * 0.4, b[2] * 0.1, b[2] * 1.1, [[0, lit], [0.55, leaf], [1, dark]]);
    c.fill();
  });
  if (o.blossom) {
    const rb = mulberry(5 + Math.floor(x));
    for (let i = 0; i < 26; i++) { const b = bl[(rb() * bl.length) | 0]; const a = rb() * TAU, d = rb() * b[2] * 0.9; c.fillStyle = col(o.blossom, 0.9); c.beginPath(); c.arc(b[0] + Math.cos(a) * d, b[1] + Math.sin(a) * d, 2.2 + rb() * 2, 0, TAU); c.fill(); }
  }
  c.restore();
}

/* arcos de sillar (portal / mirador) */
function arcade(c, x, y, n, aw, ah, o) {
  o = o || {};
  const wall = o.wall || '#f1e6d2', wallSh = o.wallSh || '#cdbfae', pil = o.pil || 18;
  const total = n * aw + (n + 1) * pil;
  c.save();
  /* fondo de la pared */
  c.fillStyle = wall; c.fillRect(x, y - ah - pil * 1.4, total, ah + pil * 1.4);
  for (let i = 0; i < n; i++) {
    const ax = x + pil + i * (aw + pil);
    c.beginPath();
    c.moveTo(ax, y); c.lineTo(ax, y - ah + aw / 2); c.arc(ax + aw / 2, y - ah + aw / 2, aw / 2, Math.PI, 0); c.lineTo(ax + aw, y); c.closePath();
    c.fillStyle = o.inside || '#b9cdf0'; c.fill();
    c.save(); c.clip();
    if (o.view) o.view(ax, y - ah, aw, ah, i);
    c.fillStyle = col(wallSh, 0.5); c.fillRect(ax, y - ah, aw * 0.1, ah);
    c.restore();
    c.beginPath();
    c.moveTo(ax, y); c.lineTo(ax, y - ah + aw / 2); c.arc(ax + aw / 2, y - ah + aw / 2, aw / 2, Math.PI, 0); c.lineTo(ax + aw, y);
    c.lineWidth = 5; c.strokeStyle = shade(wallSh, 0.1); c.stroke();
  }
  c.fillStyle = lin(c, 0, y - ah - pil * 1.4, 0, y - ah - pil * 0.4, [[0, col('#fff8ea', 1)], [1, wall]]);
  c.fillRect(x - 6, y - ah - pil * 1.7, total + 12, pil * 0.45);
  c.fillStyle = wallSh; c.fillRect(x - 6, y - ah - pil * 1.25, total + 12, 5);
  c.restore();
  return total;
}

/* catedral de Arequipa (fachada con dos torres) */
function cathedral(c, x, base, s, o) {
  o = o || {};
  const wall = o.wall || '#f4ead6', sh = o.sh || '#cfc1ad', dark = o.dark || '#a9988a';
  c.save();
  c.translate(x, base); c.scale(s, s);
  const body = (px, py, w, h, f) => { c.fillStyle = f || wall; c.fillRect(px, py, w, h); c.fillStyle = col(sh, 0.55); c.fillRect(px + w * 0.82, py, w * 0.18, h); };
  /* cuerpo central y torres */
  body(-210, -150, 420, 150);
  body(-250, -270, 90, 270); body(160, -270, 90, 270);
  /* frontón */
  c.beginPath(); c.moveTo(-210, -150); c.lineTo(0, -215); c.lineTo(210, -150); c.closePath(); c.fillStyle = wall; c.fill();
  c.beginPath(); c.moveTo(-170, -156); c.lineTo(0, -203); c.lineTo(170, -156); c.closePath(); c.strokeStyle = sh; c.lineWidth = 4; c.stroke();
  /* campanarios */
  [-205, 205].forEach((cx2) => {
    c.fillStyle = wall; c.fillRect(cx2 - 36, -310, 72, 40);
    c.beginPath(); c.moveTo(cx2 - 40, -310); c.lineTo(cx2, -352); c.lineTo(cx2 + 40, -310); c.closePath(); c.fillStyle = shade(wall, 0.05); c.fill();
    c.beginPath(); c.rect(cx2 - 36, -310, 72, 40); c.strokeStyle = sh; c.lineWidth = 3; c.stroke();
    c.beginPath(); c.moveTo(cx2 - 12, -272); c.lineTo(cx2 - 12, -296); c.arc(cx2, -296, 12, Math.PI, 0); c.lineTo(cx2 + 12, -272); c.closePath(); c.fillStyle = dark; c.fill();
    c.fillStyle = sh; c.fillRect(cx2 - 2, -368, 4, 18); c.fillRect(cx2 - 8, -362, 16, 4);
    [-1, 1].forEach((k) => { c.beginPath(); c.moveTo(cx2 + k * 16, -230); c.lineTo(cx2 + k * 16, -246); c.arc(cx2 + k * 16 + 0, -246, 0, 0, 0); c.strokeStyle = sh; c.stroke(); });
    c.beginPath(); c.moveTo(cx2 - 14, -214); c.lineTo(cx2 - 14, -240); c.arc(cx2, -240, 14, Math.PI, 0); c.lineTo(cx2 + 14, -214); c.closePath(); c.fillStyle = dark; c.fill();
  });
  /* galería de columnas */
  for (let i = 0; i < 9; i++) {
    const px = -190 + i * 47.5;
    c.fillStyle = wall; c.fillRect(px - 9, -130, 18, 130);
    c.fillStyle = col(sh, 0.5); c.fillRect(px + 2, -130, 7, 130);
    c.fillStyle = sh; c.fillRect(px - 12, -134, 24, 8); c.fillRect(px - 12, -8, 24, 8);
    if (i < 8) {
      c.beginPath(); c.moveTo(px + 9, 0); c.lineTo(px + 9, -92); c.arc(px + 23.75, -92, 14.75, Math.PI, 0); c.lineTo(px + 38.5, 0); c.closePath();
      c.fillStyle = i === 3 || i === 4 ? '#6d5a52' : dark; c.fill();
    }
  }
  /* ventanas y rosetón */
  c.beginPath(); c.arc(0, -178, 14, 0, TAU); c.fillStyle = dark; c.fill();
  c.strokeStyle = sh; c.lineWidth = 3; c.stroke();
  /* sombra de la base */
  c.fillStyle = lin(c, 0, -20, 0, 0, [[0, col('#000', 0)], [1, col('#5a4a50', 0.35)]]); c.fillRect(-260, -20, 520, 20);
  c.restore();
}

/* casa arequipeña sencilla */
function house(c, x, base, s, o) {
  o = o || {};
  const wall = o.wall || '#f3e6d0', sh = o.sh || '#cdb99c', roof = o.roof || '#b9825f';
  c.save(); c.translate(x, base); c.scale(s, s);
  c.fillStyle = wall; c.fillRect(-90, -130, 180, 130);
  c.fillStyle = col(sh, 0.55); c.fillRect(50, -130, 40, 130);
  c.fillStyle = shade(wall, -0.06); c.fillRect(-98, -142, 196, 14);
  c.fillStyle = sh; c.fillRect(-98, -130, 196, 4);
  /* puerta */
  c.fillStyle = o.door || '#7a5237'; c.beginPath(); rr(c, 20, -88, 38, 88, 3); c.fill();
  c.fillStyle = col('#2b1a10', 0.35); c.fillRect(20, -88, 38, 6);
  c.fillStyle = '#e6c98a'; c.beginPath(); c.arc(52, -42, 2.6, 0, TAU); c.fill();
  /* ventana con luz */
  const lit = o.lit === undefined ? 0 : o.lit;
  c.fillStyle = mixHex('#4c6da8', '#ffd98a', lit); c.beginPath(); rr(c, -66, -102, 56, 50, 3); c.fill();
  if (lit > 0.05) glow(c, -38, -78, 90, '#ffcf80', 0.5 * lit);
  c.fillStyle = col('#fff', 0.3); c.fillRect(-66, -102, 56, 6);
  c.strokeStyle = sh; c.lineWidth = 4; c.beginPath(); rr(c, -66, -102, 56, 50, 3); c.stroke();
  c.fillStyle = sh; c.fillRect(-72, -52, 68, 6);
  c.beginPath(); c.moveTo(-66, -77); c.lineTo(-10, -77); c.moveTo(-38, -102); c.lineTo(-38, -52); c.lineWidth = 3; c.stroke();
  c.restore();
  return { doorX: x + 39 * s, doorY: base };
}

      c.beginPath(); rr(c, -142 + i * 50, -152 + r * 48, 34, 34, 3); c.fill();

    c.beginPath(); c.moveTo(-160, -156); c.lineTo(0, -206); c.lineTo(160, -156); c.closePath(); c.strokeStyle = '#c9b494'; c.lineWidth = 4; c.stroke();
    for (let i = 0; i < 6; i++) {

    c.fillStyle = '#fff'; c.beginPath(); rr(c, -100, -186, 200, 22, 5); c.fill();
    textC(c, 'UNSA · SOCIALES · DERECHO', 0, -175, 12.5, '#7a2a4a', { weight: 800 });
  }
  c.restore();

/* calle / vereda en perspectiva sencilla */
function groundPlane(c, y, color, color2) {
  c.fillStyle = lin(c, 0, y, 0, H, [[0, color], [1, color2 || shade(color, -0.12)]]);
  c.fillRect(-60, y, W + 120, H - y + 60);
}

/* farol con halo */
function lamppost(c, x, base, h, on, t) {
  c.fillStyle = '#3a3550'; c.fillRect(x - 3, base - h, 6, h);
  c.beginPath(); c.moveTo(x - 3, base - h); c.quadraticCurveTo(x - 3, base - h - 16, x + 16, base - h - 14); c.lineWidth = 4; c.strokeStyle = '#3a3550'; c.stroke();
  c.fillStyle = on ? '#ffe8a8' : '#8d8fa8'; c.beginPath(); c.arc(x + 17, base - h - 8, 6, 0, TAU); c.fill();
  if (on) { glow(c, x + 17, base - h - 8, 120, '#ffd88a', 0.7); }
}

/* banca */
function bench(c, x, base, s, o) {
  o = o || {};
  c.save(); c.translate(x, base); c.scale(s, s);
  c.fillStyle = o.wood || '#b07c52'; c.fillRect(-60, -34, 120, 8);

  c.restore();
}

/* mochila-sombra para detalle de suelo: líneas de adoquín */
function cobbles(c, y0, y1, color, seed) {
  const r = mulberry(seed || 4);
  c.save();
  c.globalAlpha = 0.22;
  for (let y = y0; y < y1; y += 14 + (y - y0) * 0.06) {
    const sc = 0.6 + (y - y0) / (y1 - y0) * 1.4;
    for (let x = -40; x < W + 40; x += 34 * sc) {
      c.fillStyle = col(color, 0.3 + r() * 0.4);
      c.fillRect(x + (r() * 6), y, 28 * sc, 2);
    }
  }
  c.restore();
}

/* reloj digital para los recuadros del día */
function clockBadge(c, x, y, str, a) {
  c.save();
  c.globalAlpha = a === undefined ? 1 : a;
  c.fillStyle = 'rgba(14,10,32,.5)'; c.beginPath(); rr(c, x, y, 128, 38, 12); c.fill();
  textC(c, str, x + 64, y + 20, 21, '#fff', { weight: 800 });
  c.restore();
}

'use strict';
/* ============ piezas de interfaz dentro de la animación: celulares, chats, laptops, cuartos ============ */

function wrapLines(c, text, maxW) {
  const words = text.split(' '); const lines = []; let cur = '';
  words.forEach((w) => { const test = cur ? cur + ' ' + w : w; if (c.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; });
  if (cur) lines.push(cur);
  return lines;
}

/* burbuja de chat; side 'me' (derecha) u 'ot' (izquierda). Devuelve altura */
function chatBubble(c, x, y, w, text, side, o) {
  o = o || {};
  const fs = o.size || 17;
  c.save();
  c.font = '600 ' + fs + 'px ' + F_UI;
  const lines = wrapLines(c, text, w - 28);
  const h = lines.length * (fs + 5) + 18;
  const tw = Math.min(w, Math.max(...lines.map((l) => c.measureText(l).width)) + 28);
  const bx = side === 'me' ? x + w - tw : x;
  const a = o.a === undefined ? 1 : o.a, pop = o.pop === undefined ? 1 : o.pop;
  c.globalAlpha = a;
  c.translate(side === 'me' ? x + w : x, y + h / 2); c.scale(0.85 + 0.15 * pop, 0.85 + 0.15 * pop); c.translate(side === 'me' ? -(x + w) : -x, -(y + h / 2));
  c.shadowColor = 'rgba(60,30,100,.22)'; c.shadowBlur = 8; c.shadowOffsetY = 2;
  c.fillStyle = side === 'me' ? (o.meCol || '#ff8fb8') : (o.otCol || '#ffffff');
  c.beginPath(); rr(c, bx, y, tw, h, 15); c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.fillStyle = side === 'me' ? '#fff' : '#3b3355';
  c.textBaseline = 'top'; c.textAlign = 'left';
  lines.forEach((l, i) => c.fillText(l, bx + 14, y + 9 + i * (fs + 5)));
  if (o.name) { c.font = '800 ' + (fs - 5) + 'px ' + F_UI; c.fillStyle = o.nameCol || '#e0568a'; c.fillText(o.name, bx + 6, y - fs + 1); }
  c.restore();
  return h;
}

/* globo de pensamiento */
function thought(c, x, y, w, h, a, fn) {
  if (a <= 0.01) return;
  c.save(); c.globalAlpha = a;
  c.fillStyle = '#fff';
  c.beginPath(); rr(c, x, y, w, h, Math.min(w, h) / 2.2); c.fill();
  [[x + w * 0.15, y + h + 12, 11], [x + w * 0.08, y + h + 30, 7], [x + w * 0.03, y + h + 42, 4]].forEach((q) => { c.beginPath(); c.arc(q[0], q[1], q[2], 0, TAU); c.fill(); });
  if (fn) fn(c, x, y, w, h);
  c.restore();
}

function floatHeart(c, x, y, s, a, color) {

function heartsRise(c, t, seed, n, x0, x1, y0, speed, o) {
  o = o || {};
  const r = mulberry(seed);
  for (let i = 0; i < n; i++) {
    const bx = lerp(x0, x1, r()), ph = r() * 8, sp = (speed || 60) * (0.6 + r() * 0.8), sz = (o.size || 11) * (0.6 + r() * 0.8);

  }
}

/* ---------- 2. Día a día en dos tomas ---------- */
function dayPanel(c, who, t, w, h) {
  const girl = who === 'T';
  const home = { x: 0 };

  const doorOff = 39 * 1.5;

  const clockMin = keysN([[0, 400], [15, 450], [18, 780], [21, 1020], [24, 1080], [30, 1115], [34, 1140]], t);
  const hh = Math.floor(clockMin / 60), mm = Math.floor(clockMin % 60);

  const tt = t - start;

  const campDoor = campusX + (girl ? 18 : 0);
  if (t < 24.2) {
    wx = lerp(homeDoor + 8, campDoor - 6, eio(seg(tt, v0 + 0.0, v1)) * 0 + seg(tt, v0, v1));

    camX = t < 21 ? wx - w * 0.4 : campusX - w * 0.55;

    if (m.pad) tones.slice(0, 3).forEach((n) => pad(c, out, t0, mtof(base + n), steps * sd, m.pad));
    if (m.bass) {
      const bm = base + ch[0] - 12;
      (m.bassSteps || [0, 4]).forEach((s, i) => bassNote(c, out, t0 + s * sd, mtof(bm), sd * 2.2, m.bass * (i ? 0.75 : 1)));
    }
    if (m.arp) {
      for (let s = 0; s < steps; s++) {
        const k = m.arp[s % m.arp.length];
        if (k < 0) continue;
        const n = tones[k % tones.length] + 12 * Math.floor(k / tones.length);
        INST[m.arpInst](c, out, t0 + s * sd + (s % 2 ? 0.012 : 0), mtof(base + (m.tune ? 0 : 12) + n), sd * 2, m.arpV * (s === 0 ? 1.15 : 0.9));
      }
    }
    if (m.stab) m.stab.forEach((s) => tones.slice(0, 3).forEach((n) => pluck(c, out, t0 + s * sd, mtof(base + 12 + n), sd, 0.03)));
    if (m.drums) {
      const pop = m.drums === 'pop';
      for (let s = 0; s < steps; s++) {
        const t = t0 + s * sd;
        if (s === 0 || s === 4) kick(c, out, t, pop ? 0.22 : 0.12);
        if (pop && (s === 2 || s === 6)) noiseHit(G, out, t, 0.07, 'bandpass', 1900, 0.13);
        noiseHit(G, out, t + (s % 2 ? 0.01 : 0), pop ? (s % 2 ? 0.018 : 0.03) : 0.012, 'highpass', 7500, 0.04);
      }
    }
    if (m.tune) {
      TUNE_NOTES(m, bar).forEach((q) => {
        const f = mtof(base + 12 + q[1]);
        INST[m.melInst](c, out, t0 + q[0] * sd, f, q[2] * sd, m.melV);
        if (m.melDouble) bell(c, out, t0 + q[0] * sd, f * 2, q[2] * sd, m.melDouble);
      });
    } else if (m.mel) {
      const r = mulberry(131 + bar * 17 + base);
      const sc = m.scale, len = sc.length;
      for (let s = 0; s < steps; s++) {
        const L = m.mel[s % m.mel.length];
        if (!L) continue;
        const moves = [-2, -1, -1, 0, 1, 1, 2];
        B.pos += moves[(r() * moves.length) | 0];
        if (B.pos < 4) B.pos += 3; if (B.pos > 12) B.pos -= 3;
        const semi = sc[((B.pos % len) + len) % len] + 12 * Math.floor(B.pos / len);
        INST[m.melInst](c, out, t0 + s * sd, mtof(base + 12 + semi), L * sd, m.melV);
      }
    }
    if (m.sparkle) {
      const r = mulberry(77 + bar * 5);
      for (let i = 0; i < 3; i++) if (r() < m.sparkle) bell(c, out, t0 + r() * steps * sd, mtof(base + 36 + PENT_MAJ[(r() * 5) | 0]), 1, 0.03);
    }
    if (m.tick) for (let s = 0; s < steps; s += 2) tick(c, out, t0 + s * sd, m.tick);
  }
  function TUNE_NOTES(m, bar) { return m.tune[bar % m.tune.length]; }

  /* ---- reproducción en vivo: el cambio de ánimo ocurre al inicio del siguiente compás, sin cortar la melodía ---- */
  let G = null, cur = null, curName = '', nextT = 0, bar = 0, timer = 0, muted = false, wanted = '', pending = '';
  function applySwitch(name, at) {
    const c = G.c;
    const old = cur;
    if (old) {
      old.bus.gain.cancelScheduledValues(at); old.bus.gain.setValueAtTime(old.bus.gain.value, at); old.bus.gain.linearRampToValueAtTime(0, at + 1.4);
      setTimeout(() => { try { old.nodes.forEach((n) => n.stop()); old.bus.disconnect(); old.send.disconnect(); } catch (e) { /* ya detenido */ } }, 10000);
    }
    cur = makeBus(G, name); curName = name;
    cur.bus.gain.setValueAtTime(0, Math.max(0, at - 0.02)); cur.bus.gain.linearRampToValueAtTime(1, at + (old ? 0.5 : 1.8));
  }
  function tickLoop() {
    if (!G) return;
    const c = G.c;
    let guard = 0;
    while (nextT < c.currentTime + 0.5 && guard++ < 4) {
      if (pending && pending !== curName) { applySwitch(pending, nextT); pending = ''; }
      if (!cur) break;
      const m = MOODS[curName];
      scheduleBar(G, cur, m, nextT, bar);
      nextT += 8 * 60 / m.bpm / 2; bar++;
    }
  }
  function switchTo(name) {
    if (!G || !MOODS[name] || (name === curName && !pending)) return;
    if (!cur) { nextT = G.c.currentTime + 0.12; }
    pending = name;
    tickLoop();
  }

  return {
    init() {
      if (G) { if (G.c.state === 'suspended') G.c.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = new AC();
      G = makeGraph(c);
      timer = setInterval(tickLoop, 120);
      if (c.state === 'suspended') c.resume();
      if (wanted) switchTo(wanted);
    },
    mood(name) {
      wanted = name;
      if (G) switchTo(name);
    },
    pause(p) {
      if (!G) return;
      if (p) G.c.suspend(); else G.c.resume();
    },
    mute(m) {
      muted = m;
      if (!G) return;
      G.master.gain.cancelScheduledValues(G.c.currentTime);
      G.master.gain.linearRampToValueAtTime(m ? 0 : 0.9, G.c.currentTime + 0.4);
    },
    /* para pruebas: renderiza un estado de ánimo sin conexión y devuelve pico y RMS */
    async _render(name, secs) {
      const sr = 22050;
      const oc = new OfflineAudioContext(2, sr * secs, sr);
      const g = makeGraph(oc), m = MOODS[name];
      const B = makeBus(g, name); B.bus.gain.value = 1;
      let t = 0, b = 0;
      while (t < secs) { scheduleBar(g, B, m, t, b); t += 8 * 60 / m.bpm / 2; b++; }
      const buf = await oc.startRendering();
      let peak = 0, sum = 0, n = 0;
      for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; sum += d[i] * d[i]; n++; } }
      return { name, peak: +peak.toFixed(3), rms: +Math.sqrt(sum / n).toFixed(4) };
    },
    moods: Object.keys(MOODS),
  };
})();

/* ---- 90-main.js ---- */
'use strict';
/* ============ arranque, controles y subtítulos ============ */
const $ = (id) => document.getElementById(id);
let _capShown = '';

function updateCaption(s, lt) {
  const el = $('cap');
  if (!el) return;
  let txt = '';
  if (s.cap) for (let i = 0; i < s.cap.length; i++) if (lt >= s.cap[i][0] && lt < s.cap[i][1]) { txt = s.cap[i][2]; break; }
  if (txt !== _capShown) {
    _capShown = txt;
    if (txt) { el.textContent = txt; el.classList.add('on'); } else el.classList.remove('on');
  }
}
function onSceneChange(s) {
  if (typeof Music !== 'undefined' && ST.started) { try { Music.mood(s.music); } catch (e) { console.error('audio: ' + e.message); } }
  _capShown = '';
  const ce = $('cap'); if (ce) ce.classList.remove('on');
}
function onEnd() {
  $('end').hidden = false;
  $('frame').classList.add('ui');
  setPlayIcon();
}
function setPlayIcon() {
  $('icPause').hidden = !ST.playing; $('icPlay').hidden = ST.playing;
}
function fmtTime(t) { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function updateProgress(t) {
  const f = $('progFill'); if (!f) return;
  f.style.width = (t / TOTAL * 100).toFixed(2) + '%';
  $('tm').textContent = fmtTime(t);
}

function fit() {
  const fr = $('frame');
  const pad = 32;
  const aw = Math.max(280, window.innerWidth - pad), ah = Math.max(160, window.innerHeight - 8);
  let w = aw, h = w * 9 / 16;
  if (h > ah) { h = ah; w = h * 16 / 9; }
  fr.style.width = Math.floor(w) + 'px';
  fr.style.height = Math.floor(h) + 'px';
  fr.style.setProperty('--u', (w / 1280).toFixed(4));
  $('hint').hidden = !(window.innerHeight > window.innerWidth * 1.05);
}

let _uiTimer = 0;
function showUI() {
  const fr = $('frame');
  fr.classList.add('ui');
  clearTimeout(_uiTimer);
  _uiTimer = setTimeout(() => { if (ST.playing) fr.classList.remove('ui'); }, 3200);
}

async function begin() {
  const b = $('btnStart');
  b.disabled = true;
  if (typeof Music !== 'undefined') { try { Music.init(); } catch (e) { console.error('audio: ' + e.message); } }
  ST.started = true; ST.playing = true; ST.t = 0; ST.idx = -1;
  $('start').classList.add('off');
  setTimeout(() => { $('start').hidden = true; }, 900);
  if (typeof Music !== 'undefined') Music.mood(SCENES[0].music);
  setPlayIcon(); showUI();
}
function togglePlay() {
  if (!ST.started) return;
  if (ST.ended) { restart(); return; }
  ST.playing = !ST.playing;
  if (typeof Music !== 'undefined') Music.pause(!ST.playing);
  setPlayIcon(); showUI();
}
function restart() {
  ST.ended = false; ST.t = 0; ST.idx = -1; ST.playing = true;
  $('end').hidden = true;
  if (typeof Music !== 'undefined') { Music.pause(false); Music.mood(SCENES[0].music); }
  setPlayIcon(); showUI();
}
function toggleMute() {
  ST.muted = !ST.muted;
  if (typeof Music !== 'undefined') Music.mute(ST.muted);
  $('icOn').hidden = ST.muted; $('icOff').hidden = !ST.muted;
  showUI();
}
function goFull() {
  const fr = $('frame');
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (fr.requestFullscreen) fr.requestFullscreen().catch(() => {});
  } catch (e) { /* algunos visores no permiten pantalla completa */ }
}

/* resolución adaptable: si el dispositivo va lento, baja la nitidez del lienzo para que nunca se trabe */
let RES = 1, _lagEma = 16, _lastRaw = 0, _lagHold = 0;
function setRes(r) {
  RES = r;
  _ctxDepth = 0;
  CV.width = Math.round(W * r); CV.height = Math.round(H * r);
  CTX.setTransform(1, 0, 0, 1, 0, 0);
  CTX.scale(CV.width / W, CV.height / H);
}
function watchLag(now) {
  const raw = _lastRaw ? now - _lastRaw : 16; _lastRaw = now;
  if (!ST.playing || raw > 400) return;
  _lagEma = _lagEma * 0.92 + raw * 0.08;
  if (_lagHold > 0) { _lagHold--; return; }
  if (_lagEma > 36 && RES > 0.6) { setRes(Math.max(0.6, RES * 0.8)); _lagEma = 20; _lagHold = 90; }
}
let _booted = false;
function boot() {
  if (_booted) return; _booted = true;
  CV = $('stage'); CTX = CV.getContext('2d'); guardCtx(CTX);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  RES = Math.min(1.25, dpr);
  CV.width = Math.round(W * RES); CV.height = Math.round(H * RES);
  CTX.scale(CV.width / W, CV.height / H);
  fit();
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
  /* ticks de escenas */
  const ticks = $('progTicks');
  SCENES.forEach((s) => { const i = document.createElement('i'); i.style.left = (s.start / TOTAL * 100) + '%'; ticks.appendChild(i); });
  $('btnStart').addEventListener('click', begin);
  $('btnAgain').addEventListener('click', restart);
  $('bPlay').addEventListener('click', togglePlay);
  $('bNext').addEventListener('click', () => { if (ST.started) { nextMark(); showUI(); } });
  $('bPrev').addEventListener('click', () => { if (ST.started) { prevMark(); showUI(); } });
  $('bMute').addEventListener('click', toggleMute);
  $('bFull').addEventListener('click', goFull);
  const prog = $('prog');
  const seekFrom = (e) => { const r = prog.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX); if (ST.started) { seek((x - r.left) / r.width * TOTAL); showUI(); } };
  prog.addEventListener('click', seekFrom);
  $('frame').addEventListener('mousemove', showUI);
  $('frame').addEventListener('touchstart', showUI, { passive: true });
  $('frame').addEventListener('click', (e) => { if (e.target === CV) { if (ST.started) { if ($('frame').classList.contains('ui') && ST.playing) togglePlay(); else showUI(); } } });
  document.addEventListener('keydown', (e) => {
    if (!ST.started) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'ArrowRight') nextMark();
    else if (e.code === 'ArrowLeft') prevMark();
    else if (e.key === 'm') toggleMute();
    else if (e.key === 'f') goFull();
  });
  document.addEventListener('visibilitychange', () => {
    if (!ST.started) return;
    if (document.hidden) { if (typeof Music !== 'undefined') Music.pause(true); }
    else if (ST.playing && typeof Music !== 'undefined') Music.pause(false);
  });
  /* portada: un fotograma de la intro detrás del botón */
  ST.t = 6.2; renderAt(ST.t); ST.idx = -1;
  const fonts = ['800 20px Nunito', '600 20px Fraunces', 'italic 500 20px Fraunces', '700 20px Caveat', '900 20px Nunito'];
  const ready = Promise.all(fonts.map((f) => document.fonts.load(f).catch(() => null)));
  const timeout = new Promise((r) => setTimeout(r, 3500));
  Promise.race([ready, timeout]).then(() => {
    const b = $('btnStart'); b.disabled = false; b.textContent = 'Comenzar ♥';
    renderAt(ST.t); ST.idx = -1;
  });
  requestAnimationFrame(frame);
}
window.__seek = (t) => { ST.started = true; seek(t); return ST.idx; };
window.__scenes = () => SCENES.map((s) => ({ id: s.id, start: s.start, dur: s.dur }));
window.__ST = ST;
window.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();

</script>
